<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginScreen" class="launcher hidden">
    <div class="launcher-card">
        <h1>J.A.R.V.I.S</h1>
        <input id="loginUser" placeholder="Login" autocomplete="username" />
        <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="loginBtn">Log In</button>
        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="mainApp" class="jarvis-container hidden">
    <div class="header">
        <div id="userBadge" class="user-badge"></div>
        <div class="title"><h1>J.A.R.V.I.S</h1></div>
        <div class="status-badge">
            <div class="status-led"></div>
            <div class="status-text" id="statusLabel">Active</div>
            <div class="settings-btn" id="settingsBtn">S</div>
            <div class="settings-btn" id="logoutBtn" title="Logout">X</div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message jarvis-message">
            <div class="bubble">
                <div class="bubble-header">System</div>
                <div class="bubble-text">System ready, sir.</div>
                <div class="bubble-footer">00:00:00</div>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <textarea id="userInput" rows="1" placeholder="Сообщение..."></textarea>
            <button id="sendBtn">Send</button>
        </div>
        <div class="input-options">
            <label for="useInternet">
                <input type="checkbox" id="useInternet">
                <span>Поиск в интернете</span>
            </label>
        </div>
    </div>
</div>

<div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-header">
        <span>Settings</span>
        <span class="settings-close" id="settingsClose">X</span>
    </div>
    <div class="settings-body">
        <div class="setting-item">
            <label for="voiceSelect">Voice:</label>
            <select id="voiceSelect">
                <option value="client" selected>Browser (Web Speech)</option>
                <option value="server">VoxCPM2 (Server)</option>
                <option value="off">Off</option>
            </select>
        </div>
        <div class="setting-item">
            <label for="modelSelect">LLM Model:</label>
            <select id="modelSelect">
                <option value="llama3.1:8b" selected>Llama 3.1 8B</option>
                <option value="phi3:mini">Phi-3 Mini</option>
                <option value="qwen2.5:7b">Qwen 2.5 7B</option>
            </select>
        </div>
    </div>
</div>

<div id="adminPanel" class="settings-panel hidden" style="left:20px; right:auto;">
    <div class="settings-header">
        <span>Admin Panel</span>
        <span class="settings-close" id="adminClose">X</span>
    </div>
    <div class="settings-body">
        <div class="setting-item">
            <button id="showSessionsBtn">Sessions</button>
            <button id="showLogsBtn">Logs</button>
        </div>
        <pre id="adminContent" style="max-height:400px; overflow:auto; font-size:11px;"></pre>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
